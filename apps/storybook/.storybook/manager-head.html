<style>
  /* Storybook's range control shrinks its track to nothing when the controls panel is narrow (the min and value labels
     keep their width); keep the track usable at any panel width. */
  input[type='range'] {
    flex: 1 1 96px;
    min-width: 96px;
  }
  /* One component tree: the toolbar's React | Angular switch (framework-switch/manager.tsx) sets data-ds-framework on
     <html>; React shows this Storybook's tree, Angular the composed Angular Storybook's, without its section heading. */
  #storybook-explorer-tree > [aria-label$='Angular stories'],
  html:not([data-ds-framework='angular']) #storybook-explorer-tree > [data-title='Angular'],
  html[data-ds-framework='angular'] #storybook-explorer-tree > div:not([data-title='Angular']) {
    display: none;
  }
</style>
